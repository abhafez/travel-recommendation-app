<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Recommendation | Contact Us</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">Wanderlust</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html" class="active">Contact Us</a></li>
    </ul>
  </nav>

  <section class="page-section">
    <h1>Contact Us</h1>
    <p>Have a question, feedback, or a destination we should feature? Send us a message below.</p>

    <form class="contact-form" id="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Your message..." required></textarea>

      <button type="submit">Send Message</button>
      <p id="form-status"></p>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 Wanderlust Travel Recommendations. All rights reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
